name: Build playable Worldwalker Offline

on:
  push:
    branches: [offline-mode/native-worldwalker]
    paths:
      - '.build-offline-windows'

permissions:
  contents: read

jobs:
  windows-playable:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      WORLDWALKER_DATA_DIR: ${{ github.workspace }}\.build-test-data
      PYTHONUTF8: '1'
      PYTHONPATH: '${{ github.workspace }}\backend;${{ github.workspace }}\tests;${{ github.workspace }}\tools'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime, test, and build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7" pytest pillow
      - name: Validate Offline Mode before packaging
        run: python -m pytest tests/test_offline_mode_native.py -q
      - name: Check JavaScript syntax
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          for path in [*Path('frontend/js').glob('*.js'), Path('frontend/sw.js'), Path('frontend/tactical/campaign.js')]:
              subprocess.run(['node', '--check', str(path)], check=True)
      - name: Make portable package fully self-contained
        shell: python
        run: |
          from pathlib import Path
          import re, shutil
          index = Path('frontend/index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(r'<link[^>]+href="https://fonts\.googleapis\.com[^>]*>\s*', '', text)
          text = re.sub(r'<link[^>]+href="https://fonts\.gstatic\.com[^>]*>\s*', '', text)
          text = re.sub(r'<link[^>]+rel="preconnect"[^>]+fonts\.googleapis\.com[^>]*>\s*', '', text)
          text = re.sub(r'<link[^>]+rel="preconnect"[^>]+fonts\.gstatic\.com[^>]*>\s*', '', text)
          index.write_text(text, encoding='utf-8')
          css = Path('frontend/css/style.css')
          c = css.read_text(encoding='utf-8')
          c = re.sub(r'@font-face\{font-family:"Nova Square";src:url\("/fonts/nova-square\.ttf"\)[^}]*\}\s*', '', c)
          css.write_text(c, encoding='utf-8')
          sw = Path('frontend/sw.js')
          s = sw.read_text(encoding='utf-8').replace(', "/fonts/nova-square.ttf"', '').replace('"/fonts/nova-square.ttf", ', '')
          sw.write_text(s, encoding='utf-8')
          shutil.rmtree('frontend/fonts', ignore_errors=True)
          assert 'fonts.googleapis.com' not in index.read_text(encoding='utf-8')
          assert 'nova-square.ttf' not in css.read_text(encoding='utf-8')
      - name: Remove test data so first launch is genuinely fresh
        shell: powershell
        run: if (Test-Path .build-test-data) { Remove-Item .build-test-data -Recurse -Force }
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean WorldwalkerRPG.spec
      - name: Verify fresh packaged executable and assets
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          exe = Path('dist/WorldwalkerRPG/WorldwalkerRPG.exe').resolve()
          assert exe.is_file(), 'WorldwalkerRPG.exe is missing'
          with exe.open('rb') as handle:
              assert handle.read(2) == b'MZ', 'Package is not a Windows executable'
          subprocess.run([str(exe), '--self-test'], check=True, timeout=90)
          root = Path('dist/WorldwalkerRPG')
          frontend = root / '_internal' / 'frontend'
          for rel in ['index.html','js/app.js','js/action-deck.js','css/style.css','js/workspace-tabs.js','js/world-atlas.js','tactical/campaign.html','sw.js']:
              assert (frontend / rel).is_file(), f'Missing packaged asset: {rel}'
          forbidden = {'.ttf','.otf','.woff','.woff2'}
          leaked = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not leaked, 'Portable ZIP must not contain font files: ' + ', '.join(map(str, leaked))
          index = (frontend / 'index.html').read_text(encoding='utf-8')
          assert 'fonts.googleapis.com' not in index and 'fonts.gstatic.com' not in index
          assert (frontend / 'js/app.js').read_bytes() == Path('frontend/js/app.js').read_bytes()
          assert (frontend / 'js/action-deck.js').read_bytes() == Path('frontend/js/action-deck.js').read_bytes()
      - name: Add launch instructions and package ZIP
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          root = Path('dist/WorldwalkerRPG')
          if Path('music').is_dir(): shutil.copytree('music', root / 'music', dirs_exist_ok=True)
          (root / 'START_WORLDWALKER_OFFLINE.bat').write_text('@echo off\r\ncd /d "%~dp0"\r\nstart "" "%~dp0WorldwalkerRPG.exe"\r\n', encoding='utf-8')
          (root / 'OFFLINE_README.txt').write_text(
              'WORLDWALKER OFFLINE\n\n'
              '1. Extract this entire ZIP to a normal folder.\n'
              '2. Double-click START_WORLDWALKER_OFFLINE.bat (or WorldwalkerRPG.exe).\n'
              '3. Keep the _internal folder beside WorldwalkerRPG.exe.\n\n'
              'Offline Mode uses Worldwalker\'s normal campaign, map, Chronicle, powers/forms, relationships, progression and combat systems, but structured Activities replace required AI narration.\n'
              'The package is unsigned, so Windows may show a SmartScreen warning.\n', encoding='utf-8')
          (root / 'BUILD_INFO.txt').write_text(
              'Worldwalker Offline — native Worldwalker 3.64 mode\n'
              'Source commit: ' + os.environ['GITHUB_SHA'] + '\n'
              'Build run: ' + os.environ['GITHUB_RUN_ID'] + '\n'
              'Validated: Offline Mode tests, JavaScript syntax, Windows packaged fresh-launch self-test, bundled-asset verification.\n', encoding='utf-8')
          shutil.make_archive('Worldwalker-Offline-Native-Playable-Windows', 'zip', 'dist', 'WorldwalkerRPG')
      - uses: actions/upload-artifact@v7
        with:
          name: Worldwalker-Offline-Native-Playable-Windows
          path: Worldwalker-Offline-Native-Playable-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
