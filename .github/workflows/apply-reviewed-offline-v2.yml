name: Apply reviewed native Offline Mode fixes

on:
  push:
    branches:
      - offline-mode/reviewed-native-v2
    paths:
      - ".offline-fix-ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify regression fix integrity
        shell: bash
        run: |
          echo "477a20fc4462bc3b0558ed7000977a1da660c343e9a54b2a95303069e8612941  .offline-fix/payload.b64" | sha256sum -c -
      - name: Apply regression fixes
        shell: bash
        run: |
          base64 -d .offline-fix/payload.b64 | gzip -dc > /tmp/offline-fix.patch
          git apply --check /tmp/offline-fix.patch
          git apply /tmp/offline-fix.patch
          rm -rf .offline-fix .offline-fix-ready
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "worldwalker-offline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Offline Mode compatibility regressions"
          git push origin HEAD:offline-mode/reviewed-native-v2
