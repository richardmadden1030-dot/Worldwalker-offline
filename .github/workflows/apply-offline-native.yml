name: Apply and review native Offline Mode

on:
  push:
    branches: [offline-mode/native-worldwalker]
    paths:
      - '.apply-offline-native'

permissions:
  contents: write

jobs:
  review-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORLDWALKER_DATA_DIR: ${{ github.workspace }}/.build-test-data
      PYTHONPATH: backend:tests:tools
      PYTHONUTF8: '1'
      WORLDWALKER_ADVENTURE_SCREENSHOT: ${{ github.workspace }}/qa/living-adventures.png
      WORLDWALKER_QA_SCREENSHOT: ${{ github.workspace }}/qa/workspace.png
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reconstruct and apply reviewed Offline Mode patch
        shell: bash
        run: |
          echo '5a0ef8b9791f1820f5544ba6241c0fcccaecff02ea4d9219e5242572915c896b  tools/offline-patch.part00a' | sha256sum -c -
          echo '45862a9ff0686ac0c2f2108f698bfc795a7c80447ea63b6ff159c7cb53c8eb80  tools/offline-patch.part00b' | sha256sum -c -
          echo '50a6f1c4c6f8595a47272e48b903a2d411cb46843aa54f5df6ed9d98229e3753  tools/offline-patch.part01' | sha256sum -c -
          echo '2dfb3dd3f8c7e170cece24729089ae28cb6fc66dd358a5549e4b9f358dc15116  tools/offline-patch.part02' | sha256sum -c -
          echo 'ee80e665cd6a67858875a648e98ae44710c7d4336609eecb213ded9c5f733580  tools/offline-patch.part03' | sha256sum -c -
          cat tools/offline-patch.part00a tools/offline-patch.part00b tools/offline-patch.part01 tools/offline-patch.part02 tools/offline-patch.part03 > /tmp/offline-native.b64
          echo '22839be2c5f95976ec9cdb1bf7f86518db92aab3291547585163121c4d113b5b  /tmp/offline-native.b64' | sha256sum -c -
          base64 -d /tmp/offline-native.b64 > /tmp/offline-native.patch.gz
          echo '98d38a969561456bbfb4fe2ff4de5b8a4b851f23b0659d68844a3b07b2319805  /tmp/offline-native.patch.gz' | sha256sum -c -
          gunzip -c /tmp/offline-native.patch.gz > /tmp/offline-native.patch
          echo 'c815c2a1bc15ed45a394ff54ee02eb64ed7cf31e3c157443ccdefdae341a294f  /tmp/offline-native.patch' | sha256sum -c -
          git apply --check /tmp/offline-native.patch
          git apply /tmp/offline-native.patch
          rm -f tools/offline-patch.part00 tools/offline-patch.part00a tools/offline-patch.part00b tools/offline-patch.part01 tools/offline-patch.part02 tools/offline-patch.part03 .apply-offline-native
      - name: Install full regression dependencies
        run: python -m pip install flask cryptography pillow pytest playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in frontend/js/*.js frontend/sw.js frontend/tactical/campaign.js; do node --check "$file"; done
      - name: Run native Offline Mode tests
        run: python -m pytest tests/test_offline_mode_native.py -q
      - name: Run complete Worldwalker regressions and real UI harnesses
        run: |
          mkdir -p qa
          python -m pytest tests tools/check_workspace_tabs.py tools/check_reliability_browser.py tools/check_adventures_browser.py -q --junitxml=qa/offline-results.xml
      - name: Commit only after the review suite passes
        shell: bash
        run: |
          git config user.name 'worldwalker-offline-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'Implement native model-free Offline Mode'
          git push origin HEAD:offline-mode/native-worldwalker
