<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Piece Power Presets</title><link rel="stylesheet" href="one-piece-power-showcase.css"><style>
:root{--font-display:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#285c72,#092334 48%,#06131d);color:#fff0cf;font-family:Segoe UI,sans-serif}.demo{width:min(760px,calc(100% - 28px));padding:28px;border:2px solid #ddb253;background:#0b2030e8;box-shadow:0 24px 80px #0009}.demo h1{font:700 clamp(2rem,7vw,4rem)/1 Georgia,serif;margin:0 0 12px;color:#f4ca67}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.counts div{padding:17px;border:1px solid #4a788b;background:#0d2c3e}.counts b{display:block;font-size:1.8rem;color:#83deec}.counts span{font-size:.78rem;color:#b7ccd4}.demo button{width:100%;min-height:54px;border:1px solid #f4ca67;background:#cf3345;color:white;font-weight:900;letter-spacing:.08em;cursor:pointer}@media(max-width:520px){.counts{grid-template-columns:1fr}.demo{padding:18px}}

</script></body></html>
